<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML5 page -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page scale properly on phones (responsive design) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAlpha Calculator</title>
  <!-- Connects our CSS file (styling) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main wrapper: everything lives inside this box -->
  <main class="calculator">

    <!-- The screen. The top line shows the previous number and operator
         (like "12 +"), the bottom line shows what you're typing now. -->
    <section class="display">
      <div id="previous-operand" class="previous-operand"></div>
      <div id="current-operand" class="current-operand">0</div>
    </section>

    <!-- The buttons. The data-* attributes are labels that our JavaScript
         will read later to know what each button does. -->
    <section class="buttons">
      <button data-action="clear" class="btn btn-function">AC</button>
      <button data-action="delete" class="btn btn-function">DEL</button>
      <button data-operator="÷" class="btn btn-operator">÷</button>
      <button data-operator="×" class="btn btn-operator">×</button>

      <button data-number="7" class="btn">7</button>
      <button data-number="8" class="btn">8</button>
      <button data-number="9" class="btn">9</button>
      <button data-operator="−" class="btn btn-operator">−</button>

      <button data-number="4" class="btn">4</button>
      <button data-number="5" class="btn">5</button>
      <button data-number="6" class="btn">6</button>
      <button data-operator="+" class="btn btn-operator">+</button>

      <button data-number="1" class="btn">1</button>
      <button data-number="2" class="btn">2</button>
      <button data-number="3" class="btn">3</button>
      <button data-action="equals" class="btn btn-equals">=</button>

      <button data-number="0" class="btn btn-zero">0</button>
      <button data-number="." class="btn">.</button>
    </section>

  </main>

  <!-- Connects our JavaScript file (behavior). It goes last so the page
       loads first, then the script can find the elements above. -->
  <script src="script.js"></script>
</body>
</html>
